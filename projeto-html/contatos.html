<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template - Utilizar como modelo</title>
    <link rel="stylesheet" href="base.css">
</head>

<body>
    <div class="wrapper">
        <div class="menu">
            <!-- Aqui vai o seu menu -->
            <ul>
                <li><a href="home.html">Página Principal</a></li>
                <li><a href="sobre.html">Sobre a clínica</a></li>
                <li><a href="horarios.html">Horário de Atendimento</a></li>
                <li class="atual"><a href="#">Contato</a></li>
            </ul>
        </div>
        <div class="main">
            <div class="header">
                <h1>Clínica Vida Plena</h1>
                <img src="assets/img-4.jpg">
            </div>
            <div class="content">
                <div id="contatos">
                    <h2>Nossos contatos:</h2>
                    <span>(12) 3456-7890</span>
                    <span>(12) 09876-5432</span>
                </div>
                <div id="map">
                    <h2>Nossa localização:</h2>
                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d463.0688932157319!2d-48.174894183855045!3d-21.7976262276564!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1spt-BR!2sbr!4v1774464874286!5m2!1spt-BR!2sbr"
                        style="border:0;" allowfullscreen="" loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>
                <div id="formulario">
                    <h2>Preencha o formulário:</h2>
                    <fieldset>
                        <div class="row">
                            <label>Nome:</label><br><input type="text" name="nome"><br>
                        </div>
                        <div class="row">
                            <label>Email:</label><br><input type="email" name="email"><br>
                        </div>
                        <div class="row">
                            <label>Assunto:</label><br><input type="text" name="assunto"><br>
                        </div>
                        <div class="row">
                            <label>Mensagem:</label><br><textarea></textarea><br>
                        </div>

                        <button type="reset">Limpar</button>
                        <button type="submit">Enviar</button>
                    </fieldset>
                </div>
            </div>
            <div class="footer">
                <p>Desenvolvidor por <a href="https://linkedin.com/in/hugoMiquilino">Hugo Miquilino</a></p>
            </div>
        </div>
    </div>
</body>

</html>
