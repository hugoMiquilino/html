<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários 02</title>
    <style>
        .row {
            margin: 5px;
        }

        label {
            width: 100px;
            text-align: right;
            display: inline-block;
            padding-right: 5px;
        }

        fieldset {
            margin: 15px 0;
            border-radius: 10px;

            legend {
                color: gray;
            }
        }
    </style>
</head>

<body>
    <h1>Formulário de Cadastro</h1>

    <fieldset>
        <legend>Dados Pessoais</legend>
        <div class="row">
            <label for="">Nome: </label><input type="text" name="" id="">
            <label for="">Email: </label><input type="email" name="" id="">
        </div>
        <div class="row">
            <label for="">Profissão: </label><input type="text" name="" id="">
            <label for="">Empresa: </label><input type="text" name="" id="">
        </div>
    </fieldset>

    <fieldset>
        <legend>Endereço</legend>
        <div class="row">
            <label for="">Endereço: </label><input type="text" name="" id="">
            <label for="">Número: </label><input type="text" style="width: 30px" width="10">
        </div>
        <div class="row">
            <label for="">Bairro: </label><input type="text" name="" id="">
        </div>
        <div class="row">
            <label for="">Cidade/UF: </label><input type="text" name="" id="">
        </div>
    </fieldset>

    <fieldset>
        <legend>Informações de contato</legend>
        <div class="row">
            <label for="">Celular: </label><input type="text" name="" id="">
            <label for="">Whatsapp: </label><input type="text" name="" id="">
        </div>
        <div class="row">
            <label for="">LinkedIn: </label><input type="text" name="" id="">
            <label for="">Github: </label><input type="text" name="" id="">
        </div>
    </fieldset>

    <div class="row">
        <button type="reset">Limpar</button>
        <button type="submit">Enviar formulário</button>
    </div>

</body>

</html>
