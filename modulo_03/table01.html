<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        table thead th {
            background-color: black;
            color: white;
        }

        table tfoot td {
            background-color: darkgray;
        }

        table tbody tr:nth-child(even) td {
            background-color: lightgrey;
        }

        table tbody tr:hover td {
            background-color: lightskyblue;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>Tabelas</h1>

    <table width="250" cellspacing="0" cellpadding="5">
        <thead>
            <tr>
                <th colspan="2">My Table</th>
            </tr>
            <tr>
                <th>Name</th>
                <th>Age</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Luis</td>
                <td>24</td>
            </tr>
            <tr>
                <td>Hugo</td>
                <td>27</td>
            </tr>
            <tr>
                <td>Mari</td>
                <td>25</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td>Total</td>
                <td>3</td>
            </tr>
        </tfoot>
    </table>
</body>

</html>
